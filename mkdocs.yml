site_name: Transit API
site_url: https://monotch-support.github.io/transit-api
repo_url: https://github.com/monotch-support/transit-api
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
nav:
  - Introduction: index.md
  - Authentication: authentication.md
  - REST API: rest-api.md
extra_css:
  - stylesheets/width.css
plugins:
  - search
  - include-markdown
  - macros
markdown_extensions:
  - admonition
  - plantuml_markdown
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra:
  version: 1.1.0
